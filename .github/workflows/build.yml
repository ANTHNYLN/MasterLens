name: Build MasterLens (macOS + Windows)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masterlens-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_TAG: "8.0.15"
  APP_VERSION: "1.4.3"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth 1 --branch "${JUCE_TAG}" https://github.com/juce-framework/JUCE.git .tools/JUCE

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -G "Unix Makefiles" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build (all bundles)
        run: cmake --build build --config Release -j 4

      - name: Package DMG
        run: |
          set -e
          mkdir -p stage
          cp -R build/MasterLens_artefacts/Release/VST3/MasterLens.vst3 stage/
          cp -R build/MasterLens_artefacts/Release/AU/MasterLens.component stage/
          cp -R build/MasterLens_artefacts/Release/Standalone/MasterLens.app stage/
          cp packaging/Install.command "stage/安装 Install.command"
          cp packaging/Uninstall.command "stage/卸载 Uninstall.command"
          cp packaging/README-DMG.txt "stage/使用说明 README.txt"
          chmod +x "stage/安装 Install.command" "stage/卸载 Uninstall.command"
          codesign --force --deep -s - stage/MasterLens.vst3 || true
          codesign --force --deep -s - stage/MasterLens.component || true
          hdiutil create -volname "MasterLens ${APP_VERSION}" -srcfolder stage -fs HFS+ \
                  -format UDZO -ov "MasterLens-${APP_VERSION}-macOS.dmg"
          SIZE=$(stat -f%z "MasterLens-${APP_VERSION}-macOS.dmg")
          echo "DMG size: $SIZE bytes"
          test "$SIZE" -gt 1000000

      - uses: actions/upload-artifact@v7
        with:
          name: MasterLens-macOS
          path: MasterLens-${{ env.APP_VERSION }}-macOS.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: ARM64
    steps:
      - uses: actions/checkout@v7

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        shell: bash
        run: git clone --depth 1 --branch "${JUCE_TAG}" https://github.com/juce-framework/JUCE.git .tools/JUCE

      - name: Detect Visual Studio generator
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ver = & $vswhere -latest -products * -property installationVersion
          $path = & $vswhere -latest -products * -property installationPath
          Write-Host "Visual Studio $ver at $path"
          $major = [int](($ver -split '\.')[0])
          $gen = switch ($major) {
            17 { "Visual Studio 17 2022" }
            18 { "Visual Studio 18 2026" }
            default { "Visual Studio 18 2026" }
          }
          "VS_GENERATOR=$gen" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Generator: $gen"
          Get-ChildItem "$path\VC\Tools\MSVC" -Directory | Select-Object -ExpandProperty Name

      - name: Configure (MSVC ${{ matrix.arch }})
        run: cmake -S . -B build -G "$env:VS_GENERATOR" -A ${{ matrix.arch }}

      - name: Build VST3 + Standalone
        run: |
          cmake --build build --config Release --target MasterLens_VST3 -j 4
          cmake --build build --config Release --target MasterLens_Standalone -j 4

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Stage files
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "stage-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "build/MasterLens_artefacts/Release/VST3/MasterLens.vst3" $stage
          Copy-Item "build/MasterLens_artefacts/Release/Standalone/MasterLens.exe" $stage
          "STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $out = Join-Path $PWD "MasterLens-${{ env.APP_VERSION }}-Windows-${{ matrix.arch }}.exe"
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 `
            "/DVERSION=${{ env.APP_VERSION }}" "/DARCH=${{ matrix.arch }}" `
            "/DSTAGE=$env:STAGE_DIR" "/DOUTFILE=$out" "packaging/installer.nsi"
          if (!(Test-Path $out)) { throw "NSIS 未生成安装包" }

      - uses: actions/upload-artifact@v7
        with:
          name: MasterLens-Windows-${{ matrix.arch }}
          path: MasterLens-${{ env.APP_VERSION }}-Windows-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 30
